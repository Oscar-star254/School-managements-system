services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpos
      POSTGRES_USER: smartpos
      POSTGRES_PASSWORD: smartpos
    volumes: [smartpos_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpos"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://smartpos:smartpos@db:5432/smartpos
      JWT_SECRET: local-docker-secret-change-in-production
      API_PORT: 4000
      APP_URL: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
  app:
    build: .
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  smartpos_data:
